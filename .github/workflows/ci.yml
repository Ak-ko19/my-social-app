# CI for MySocialApp (ROADMAP A4).
# Backend: the Jest + Supertest API suite (A1) against a throwaway Postgres
# service container. tests/globalSetup.js sees TEST_DATABASE_URL and loads
# tests/fixtures/schema.sql into it instead of starting its local Windows
# test cluster. No secrets are needed: tests/setupEnv.js pins test-only
# values for JWT/email/Cloudinary, and nothing here touches a real DB.
# Frontend: lint + production build, so a broken import or bundle fails CI.
name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

# A newer push to the same branch/PR cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: mysocialapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d mysocialapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/mysocialapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run build
