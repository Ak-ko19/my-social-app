# CI for MySocialApp (ROADMAP A4).
# Backend: the Jest + Supertest API suite (A1) against a throwaway Postgres
# service container. tests/globalSetup.js sees TEST_DATABASE_URL and loads
# tests/fixtures/schema.sql into it instead of starting its local Windows
# test cluster. No secrets are needed: tests/setupEnv.js pins test-only
# values for JWT/email/Cloudinary, and nothing here touches a real DB.
# Frontend: lint + production build, so a broken import or bundle fails CI,
# then the security-header check (scripts/check-headers.cjs).
name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]
  # Day 13: lets the owner start a run by hand (runs the full browser suites).
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: mysocialapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d mysocialapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/mysocialapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Day 13: component + unit tests (Vitest + React Testing Library).
      - run: npm test
      - run: npm run check:i18n
      - run: npm run build
      # After the build: checks vercel.json's CSP against the built page's
      # inline script hash and the production API origin.
      - run: npm run check:headers
      # Day 27: the first download stays within its size budget, and the
      # code that should load on demand stays out of it.
      - run: npm run check:bundle

  # Day 13: the browser suites (e2e/, headless Microsoft Edge -- GitHub's
  # Ubuntu runners ship it) against a throwaway stack: Postgres below,
  # backend on :3000, frontend on :5173, all started by e2e/e2e-up.sh.
  # Minutes are limited on a private repo, so every push runs a smoke
  # subset (one suite per risky area); the full run (~40 suites incl. the
  # EN/MY/AR visual matrix) runs on pull requests to master and on demand
  # (Actions -> CI -> Run workflow).
  browser-smoke:
    name: Browser tests (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          # Throwaway container, only reachable from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_EXTERNAL_DB: '1'
      # walkthrough (feed, post, DM, live chat), reports + moderation,
      # production build + CSP, bot checks.
      E2E_ONLY: a2-walkthrough day12-report day10-errors day11-bots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd backend && npm ci)
          (cd frontend && npm ci)
          (cd e2e && npm ci)
      - name: Browser and tools
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          if [ "$E2E_FONTS" = 1 ]; then sudo apt-get update && sudo apt-get install -y fonts-noto-core; fi
          command -v microsoft-edge >/dev/null || (cd e2e && sudo npx playwright-core install --with-deps msedge)
          microsoft-edge --version
      - name: Run browser suites
        working-directory: e2e
        run: bash run-all.sh
      - name: Keep the suites' output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ github.job }}
          path: |
            e2e/out-*.txt
            e2e/*.log
            e2e/*.png
          retention-days: 7

  browser-full:
    name: Browser tests (full)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.base_ref == 'master' || github.base_ref == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_EXTERNAL_DB: '1'
      # Noto fonts: Arabic for the visual matrix, and any script in test posts.
      E2E_FONTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd backend && npm ci)
          (cd frontend && npm ci)
          (cd e2e && npm ci)
      - name: Browser and tools
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          if [ "$E2E_FONTS" = 1 ]; then sudo apt-get update && sudo apt-get install -y fonts-noto-core; fi
          command -v microsoft-edge >/dev/null || (cd e2e && sudo npx playwright-core install --with-deps msedge)
          microsoft-edge --version
      - name: Run browser suites
        working-directory: e2e
        run: bash run-all.sh
      - name: Keep the suites' output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ github.job }}
          path: |
            e2e/out-*.txt
            e2e/*.log
            e2e/*.png
          retention-days: 7
